: <!DOCTYPE html>

<meta charset="UTF-8">
<title>Image Card Layout</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
}

.card-container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

.card{
    width:250px;
    text-align:center;
}

.card img{
    width:100%;
    height:auto;
}

.image-box{
    position:relative;
}

.image-box button{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 15px;
    background:blue;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

</style>
</head>
