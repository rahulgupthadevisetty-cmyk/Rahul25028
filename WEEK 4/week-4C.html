       <!DOCTYPE html> 
<html> 
<head> 
    <title>Login</title> 
</head> 
<body style="background-color: rgb(233, 161, 120);"> 
    <h1 style="text-align:center">User Login</h1> 
    <form> 
        <table border="3" align="center" cellpadding="10"> 
            <tr> 
                <td> 
                    <label for="username">Username:</label> 
                </td> 
                <td> 
                    <input type="text" id="username"> 
                </td> 
            </tr> 
            <tr> 
                <td> 
                    <label for="password">Password:</label> 
                </td> 
                <td> 
                    <input type="password" id="password"> 
                </td> 
            </tr> 
            <tr> 
                <td colspan="2" align="center"> 
                    <button type="submit">Login</button> 
                </td> 
            </tr> 
        </table> 
    </form> 
</body> 
</html> 
<!DOCTYPE html> 
<html> 
<head> 
    <title>Register</title> 
</head> 
<body style="background-color:rgb(231, 193, 40)"> 
    <h1 style="text-align:center">User registration</h1> 
<form> 
        <table border="3px" align="center" cellpadding="10"> 
            <tr> 
                <td><label for="fullname">Full Name:</label></td> 
                <td><input type="text" id="fullname"></td> 
            </tr>  
            <tr> 
                <td><label for="email">Email:</label></td> 
                <td><input type="text" id="email"></td> 
            </tr>  
            <tr> 
                <td><label for="phone">Phone number:</label></td> 
                <td><input type="text" id="phone"></td> 
            </tr>  
            <tr> 
                <td><label for="password">Password:</label></td> 
                <td><input type="password" id="password"></td> 
            </tr> 
            <tr> 
                <td colspan="2" align="center"> 
                    <button type="submit">Register</button> 
                    <button type="submit">Reset</button> 
                </td> 
            </tr> 
        </table> 
    </form> 
</body> 
</html>
